services:
  - type: web
    name: trip-weave
    env: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: DUFFEL_API_URL
        sync: false
      - key: DUFFEL_TOKEN
        sync: false
